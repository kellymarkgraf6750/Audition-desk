<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Audition Desk — Local Prototype v2</title>
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --ink:#111111; --muted:#6d6d68; --line:#d9d9d3;
  --soft:#ecece7; --soft2:#f8f8f5; --danger:#8e2d2d; --danger-bg:#f8eaea;
  --warn:#745714; --warn-bg:#fff5d9; --ok:#28613c; --ok-bg:#e9f5ed; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #111;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;background:#fafaf7;border-right:1px solid var(--line);padding:20px 14px;z-index:4}
.brand{padding:2px 10px 18px;font-size:15px;font-weight:760;letter-spacing:.09em;text-transform:uppercase}
.session-chip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 10px;margin-bottom:12px}
.session-chip small{display:block;color:var(--muted)}.session-chip strong{display:block;margin-top:3px}.session-chip span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
nav{display:grid;gap:4px}nav button{appearance:none;border:0;border-radius:7px;background:transparent;text-align:left;padding:10px;color:#333}nav button.active{background:#111;color:#fff}
.aside-foot{position:absolute;left:24px;right:18px;bottom:18px;color:var(--muted);font-size:12px}
main{padding:26px 30px 52px;max-width:1380px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.topbar h1{font-size:25px;line-height:1.15;margin:0;font-weight:690}.topbar p{color:var(--muted);margin:6px 0 0}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#666}.dot.ok{background:#34754a}.dot.warn{background:#a3750d}
.grid{display:grid;gap:16px}.g2{grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:16px}.card h3{font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.rule{height:1px;background:var(--line);margin:16px 0}.hidden{display:none!important}
.btn{appearance:none;border:1px solid #bdbdb7;background:#fff;border-radius:7px;padding:9px 13px;font-weight:590}.btn:hover{background:#f7f7f4}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.primary:hover{background:#252525}.btn.danger{color:var(--danger);border-color:#d6b4b4}.btn.ghost{border-color:transparent;background:transparent}.btn.small-btn{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:default}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}input,select,textarea{width:100%;border:1px solid #c9c9c3;border-radius:7px;background:#fff;padding:10px}textarea{min-height:112px;resize:vertical}.field{min-width:0}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field-row.three{grid-template-columns:1.2fr .7fr .8fr}
.singer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.singer-name{font-size:30px;line-height:1.1;font-weight:680;margin:0}.singer-meta{margin-top:5px;color:var(--muted)}
.score-wrap{display:grid;gap:10px}.score-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.score-button{height:50px;border:1px solid #bdbdb7;background:#fff;border-radius:7px;font-weight:700;font-size:16px}.score-button.selected{background:#111;color:#fff;border-color:#111}.score-fine{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.score-value{font-size:20px;font-weight:720;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}.fine-actions{display:flex;gap:6px}.fine-actions button{width:38px;height:34px;border:1px solid #c5c5bf;background:#fff;border-radius:6px;font-weight:700}
.role-stack{display:grid;gap:8px}.role-field{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center}.priority{height:40px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--soft);color:#555;font-size:12px;font-weight:700}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions.end{justify-content:flex-end}.actions.space{justify-content:space-between}
.queue-tools{display:flex;gap:8px;margin-bottom:10px}.queue-tools input{padding:8px}.queue{display:grid;gap:2px;max-height:610px;overflow:auto}.queue-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:9px 8px;border-radius:6px;align-items:center;cursor:pointer}.queue-item:hover{background:#f7f7f4}.queue-item.current{background:#ededE8}.queue-item .time{color:var(--muted);font-variant-numeric:tabular-nums}.queue-item .qname{font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-score{min-width:34px;text-align:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:12px;font-weight:680;background:#fff}
.status-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.status-tag.waiting{color:#666;background:#f7f7f4}.status-tag.heard{color:#244e31;background:var(--ok-bg);border-color:#bcd9c4}.status-tag.no-show{color:#6d2929;background:var(--danger-bg);border-color:#ddbcbc}
.note{background:var(--warn-bg);border:1px solid #e8d493;border-radius:7px;padding:10px 12px;color:#4e421f}.ok-note{background:var(--ok-bg);border:1px solid #bcd9c4;border-radius:7px;padding:10px 12px;color:#234c31}.error-note{background:var(--danger-bg);border:1px solid #ddbcbc;border-radius:7px;padding:10px 12px;color:#6d2929}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;color:var(--muted);font-weight:650;position:sticky;top:0;background:var(--panel);z-index:1}.score-cell{text-align:right;font-weight:720;font-variant-numeric:tabular-nums}.rank{width:34px;color:var(--muted)}.priority-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:11px;color:var(--muted);background:#fff}.table-wrap{overflow:auto;max-width:100%}
.show-title{font-size:14px;font-weight:750;margin:18px 0 8px;padding-top:2px}.show-title:first-child{margin-top:0}.ballot-table select{min-width:140px;padding:7px}.suggestion strong{font-weight:680}.suggestion .small{margin-top:2px}.conflict-row{background:#fff4f4}
.empty{padding:42px 20px;text-align:center}.empty h2{margin:0 0 6px;font-size:19px}.empty p{margin:0 auto 18px;color:var(--muted);max-width:560px}
.setup-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px}.stack{display:grid;gap:12px}.compact-form{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px;align-items:end}.file-label{display:inline-flex;align-items:center;justify-content:center}.file-label input{display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal{width:min(560px,100%);background:#fff;border:1px solid #bbb;border-radius:12px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.modal h2{margin:0 0 4px;font-size:20px}.modal p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.kbd{border:1px solid #c9c9c3;border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff;font-size:11px;color:#555}
@media(max-width:900px){
  .app{grid-template-columns:1fr}aside{position:sticky;height:auto;padding:10px 10px 9px;border-right:0;border-bottom:1px solid var(--line)}.brand,.session-chip,.aside-foot{display:none}nav{grid-template-columns:repeat(4,1fr)}nav button{text-align:center;padding:8px 4px;font-size:12px}main{padding:18px 14px 44px}.g2,.g3,.setup-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h1{font-size:22px}.score-row{gap:5px}.score-button{height:46px}.field-row.three{grid-template-columns:1fr 1fr}.compact-form{grid-template-columns:1fr 1fr}.compact-form .full-mobile{grid-column:1/-1}
}
@media(max-width:560px){.field-row,.field-row.three{grid-template-columns:1fr}.singer-name{font-size:25px}.queue{max-height:420px}.topbar{display:block}.top-actions{justify-content:flex-start;margin-top:10px}.score-row{grid-template-columns:repeat(7,1fr)}.score-button{font-size:14px;padding:0}.compact-form{grid-template-columns:1fr}.compact-form .full-mobile{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Audition Desk</div>
    <div class="session-chip" id="sessionChip"></div>
    <nav id="nav"></nav>
    <div class="aside-foot">Local prototype · browser autosave</div>
  </aside>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY = 'auditionDeskLocalV2';
const pages = [['live','Live Entry'],['roles','Role Board'],['ballot','Final Ballot'],['setup','Setup']];
const roles = [
  ['r1','Madama Butterfly','Cio-Cio-San','Soprano'],['r2','Madama Butterfly','Lt. Pinkerton','Tenor'],['r3','Madama Butterfly','Suzuki','Mezzo-Soprano'],['r4','Madama Butterfly','Sharpless','Baritone'],['r5','Madama Butterfly','Goro','Tenor'],['r6','Madama Butterfly','Prince Yamadori','Baritone'],['r7','Madama Butterfly','The Bonze','Bass'],['r8','Madama Butterfly','The Imperial Commissioner','Bass'],['r9','Madama Butterfly','Kate Pinkerton','Mezzo-Soprano'],['r10','Madama Butterfly','The Official Registrar','Baritone'],
  ['r11','Die lustigen Weiber von Windsor','Frau Fluth','Soprano'],['r12','Die lustigen Weiber von Windsor','Herr Fluth','Baritone'],['r13','Die lustigen Weiber von Windsor','Sir John Falstaff','Bass'],['r14','Die lustigen Weiber von Windsor','Anne Reich','Soprano'],['r15','Die lustigen Weiber von Windsor','Frau Reich','Mezzo-Soprano'],['r16','Die lustigen Weiber von Windsor','Fenton','Tenor'],['r17','Die lustigen Weiber von Windsor','Junker Spärlich','Tenor'],['r18','Die lustigen Weiber von Windsor','Herr Reich','Bass'],['r19','Die lustigen Weiber von Windsor','Dr. Caius','Bass'],
  ['r20','The Snowy Day','Peter','Soprano'],['r21','The Snowy Day','Amy / Ensemble Soprano 1','Soprano'],['r22','The Snowy Day','Mama / Ensemble Soprano 2','Soprano'],['r23','The Snowy Day','Jasper / Ensemble Tenor','Tenor'],['r24','The Snowy Day','Papi / Ensemble Tenor','Tenor'],['r25','The Snowy Day','Daddy / Ensemble Bass 1','Bass'],['r26','The Snowy Day','Tim / Ensemble Bass 1','Bass-Baritone'],['r27','The Snowy Day','Billy / Ensemble Bass 2','Bass']
].map(([id,show,name,voice]) => ({id,show,name,voice}));

function freshState(){return {version:2,session:{name:'Current Season Auditions',day:'Audition Day'},roles:roles.map(r=>({...r})),singers:[],votes:{}}}
function demoSingers(){return [
  ['s1','9:00','Demo Singer 01','Soprano',8.6,['r1','r11','r14'],'Focused, confident; strongest dramatic impression so far.'],
  ['s2','9:06','Demo Singer 02','Soprano',8.2,['r11','r14','r20'],'Very clean singing; lighter dramatic profile.'],
  ['s3','9:12','Demo Singer 03','Tenor',8.4,['r2','r16','r17'],'Easy top; persuasive text.'],
  ['s4','9:18','Demo Singer 04','Mezzo-Soprano',8.1,['r3','r15','r9'],'Warm center; natural actor.'],
  ['s5','9:24','Demo Singer 05','Baritone',7.8,['r4','r12','r6'],'Good authority; compare directly with Singer 09.'],
  ['s6','9:30','Demo Singer 06','Bass',8.3,['r13','r18','r7'],'Excellent character instincts and resonance.'],
  ['s7','9:36','Demo Singer 07','Soprano',8.8,['r20','r21','r22'],'Exceptional musical specificity.'],
  ['s8','9:42','Demo Singer 08','Tenor',7.7,['r23','r24','r5'],'Strong actor; vocal fit less clear.'],
  ['s9','9:48','Demo Singer 09','Baritone',8.0,['r12','r4','r10'],'Strongest for Herr Fluth; good comic timing.'],
  ['s10','9:54','Demo Singer 10','Bass-Baritone',8.5,['r26','r25','r27'],'Flexible enough for several Snowy Day assignments.']
].map((x,i)=>({id:x[0],time:x[1],name:x[2],voice:x[3],score:x[4],roles:x[5],notes:x[6],status:'heard',order:i+1}))}

let storageAvailable = true;
let lastSaved = null;
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed.roles || !parsed.singers) return freshState();
    parsed.singers = parsed.singers.map((s,i)=>({
      ...s,
      status: s.status || (Number.isFinite(s.score) ? 'heard' : 'waiting'),
      order: s.order || i+1
    }));
    parsed.singers.forEach(s=>{delete s.decision});
    return parsed;
  }catch(e){storageAvailable=false; return freshState()}
}
let state = loadState();
let page = 'live';
let currentSingerId = state.singers[0]?.id || null;
let selectedRoleId = state.roles[0]?.id || null;
let queueQuery = '';

function saveState(showToast=false){
  lastSaved = new Date();
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageAvailable=true}
  catch(e){storageAvailable=false}
  renderSessionChip();
  if(showToast) toast(storageAvailable ? 'Saved locally' : 'Working in this tab only — export a backup');
}
function esc(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix='x'){return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7)}
function fmtScore(v){return Number.isFinite(v) ? Number(v).toFixed(1) : '—'}
function getRole(id){return state.roles.find(r=>r.id===id)}
function getSinger(id){return state.singers.find(s=>s.id===id)}
function groupedRoles(){const map=new Map();state.roles.forEach(r=>{if(!map.has(r.show))map.set(r.show,[]);map.get(r.show).push(r)});return map}
function roleOptions(selected='', includeNone=true){
  let html = includeNone ? '<option value="">— none —</option>' : '';
  for(const [show,rs] of groupedRoles()) html += `<optgroup label="${esc(show)}">${rs.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.name)} — ${esc(r.voice)}</option>`).join('')}</optgroup>`;
  return html;
}
function candidateRows(roleId){
  return state.singers.filter(s=>s.roles?.includes(roleId) && Number.isFinite(s.score)).sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    const ap=a.roles.indexOf(roleId), bp=b.roles.indexOf(roleId);
    if(ap!==bp) return ap-bp;
    return (a.order||0)-(b.order||0);
  });
}
function renderNav(){
  document.getElementById('nav').innerHTML = pages.map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
}
function renderSessionChip(){
  const el=document.getElementById('sessionChip'); if(!el) return;
  const saveText = storageAvailable ? (lastSaved ? `Saved ${lastSaved.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}` : 'Local autosave ready') : 'Storage blocked — export backups';
  el.innerHTML=`<small>Current session</small><strong>${esc(state.session.name||'Auditions')}</strong><span>${esc(state.session.day||'')} · ${esc(saveText)}</span>`;
}
function storageBadge(){return `<span class="badge"><span class="dot ${storageAvailable?'ok':'warn'}"></span>${storageAvailable?'local autosave':'session-only storage'}</span>`}
function topbar(title,subtitle,extra=''){return `<div class="topbar"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="top-actions">${storageBadge()}${extra}</div></div>`}

function statusLabel(s){
  if(s.status==='no-show') return '<span class="status-tag no-show">No-show</span>';
  if(Number.isFinite(s.score)) return '<span class="status-tag heard">Heard</span>';
  return '<span class="status-tag waiting">Waiting</span>';
}
function renderLive(){
  if(!state.singers.length){
    return topbar('Live Entry','One singer at a time; ranking happens automatically.') + `<div class="card empty"><h2>No singers loaded yet</h2><p>Load today's audition roster in Setup, or add the first singer here. Current-season roles are already loaded.</p><div class="actions" style="justify-content:center"><button class="btn primary" id="emptyAdd">Add first singer</button><button class="btn" id="emptyDemo">Load demo singers</button><button class="btn" id="emptySetup">Go to Setup</button></div></div>`;
  }
  if(!currentSingerId || !getSinger(currentSingerId)) currentSingerId=state.singers[0].id;
  const s=getSinger(currentSingerId); const idx=state.singers.findIndex(x=>x.id===s.id);
  const liveCard=`<section class="card">
    <div class="singer-head"><div><h2 class="singer-name">${esc(s.name)}</h2><div class="singer-meta">${esc(s.time||'No time')} · ${esc(s.voice||'Voice not set')}</div></div><div class="actions"><span class="badge">${s.status==='no-show'?'No-show':Number.isFinite(s.score)?'Heard':'Waiting'}</span><button class="btn small-btn" id="editSinger">Edit singer</button></div></div>
    <div class="rule"></div>
    <div class="score-wrap"><label>Score · 3.0 to 9.0</label><div class="score-row">${[3,4,5,6,7,8,9].map(n=>`<button class="score-button ${Number.isFinite(s.score)&&Math.floor(s.score)===n?'selected':''}" data-score="${n}" ${s.status==='no-show'?'disabled':''}>${n}</button>`).join('')}</div>
      <div class="score-fine"><span class="small muted">Fine adjustment</span><div class="fine-actions"><button data-adjust="-0.1" aria-label="Decrease score by 0.1" ${s.status==='no-show'?'disabled':''}>−</button><div class="score-value" id="scoreValue">${fmtScore(s.score)}</div><button data-adjust="0.1" aria-label="Increase score by 0.1" ${s.status==='no-show'?'disabled':''}>+</button></div></div>
    </div>
    <div style="margin-top:18px"><label>Possible roles · ordered by casting precedence</label><div class="role-stack">${[0,1,2].map(i=>`<div class="role-field"><div class="priority">P${i+1}</div><select data-role-index="${i}" ${s.status==='no-show'?'disabled':''}>${roleOptions(s.roles?.[i]||'',true)}</select></div>`).join('')}</div></div>
    <div style="margin-top:18px"><label>Notes</label><textarea id="notes" placeholder="What will matter when you are voting several hours from now?" ${s.status==='no-show'?'disabled':''}>${esc(s.notes||'')}</textarea></div>
    <div class="actions space" style="margin-top:14px"><div class="actions"><button class="btn" id="prevSinger" ${idx===0?'disabled':''}>← Previous</button><button class="btn primary" id="nextSinger">${idx===state.singers.length-1?'Save':'Save & Next →'}</button><button class="btn ${s.status==='no-show'?'':'danger'} small-btn" id="toggleNoShow">${s.status==='no-show'?'Restore singer':'Mark no-show'}</button></div><span class="small muted">${idx+1} of ${state.singers.length}</span></div>
  </section>`;
  const queueCard=`<section class="card"><div class="actions space"><h2 style="margin:0">Audition queue</h2><button class="btn small-btn" id="addSinger">+ Add</button></div><div class="queue-tools"><input id="queueSearch" value="${esc(queueQuery)}" placeholder="Search singers"></div><div class="queue">${state.singers.map(x=>`<div class="queue-item ${x.id===s.id?'current':''}" data-singer="${x.id}" data-search="${esc(`${x.name} ${x.voice} ${x.time}`.toLowerCase())}"><div class="time">${esc(x.time||'—')}</div><div><div class="qname">${esc(x.name)}</div><div class="small muted">${esc(x.voice||'')} ${statusLabel(x)}</div></div><div class="queue-score">${Number.isFinite(x.score)?fmtScore(x.score):x.status==='no-show'?'NS':'—'}</div></div>`).join('')}</div><div class="rule"></div><div class="note small"><strong>Working rule:</strong> record your judgment; do not maintain the ranking. Role Board and Final Ballot derive from this data automatically.</div></section>`;
  return topbar('Live Entry','Score → casting priorities → notes → next.',`<span class="badge">${state.singers.filter(x=>Number.isFinite(x.score)).length} heard · ${state.singers.filter(x=>x.status==='waiting').length} waiting</span>`) + `<div class="grid g2">${liveCard}${queueCard}</div>`;
}

function renderRoleBoard(){
  const role=getRole(selectedRoleId)||state.roles[0]; selectedRoleId=role?.id||null;
  const rows=role?candidateRows(role.id):[];
  return topbar('Role Board','Choose a role and see your candidates in ranked order.') + `<div class="card"><div class="field-row"><div class="field"><label>Role</label><select id="roleSelect">${roleOptions(role?.id||'',false)}</select></div><div class="field"><label>Current shortlist</label><div class="badge" style="margin-top:5px">${rows.length} candidate${rows.length===1?'':'s'}</div></div></div><div id="roleBoardTable" style="margin-top:16px">${roleBoardTable(role,rows)}</div></div>`;
}
function roleBoardTable(role,rows){
  if(!role) return '<div class="empty muted">No roles configured.</div>';
  return `<div class="small muted" style="margin-bottom:8px">${esc(role.show)} · ${esc(role.voice)}</div><div class="table-wrap"><table><thead><tr><th class="rank">#</th><th>Singer</th><th style="text-align:right">Score</th><th>Priority</th><th>Notes</th></tr></thead><tbody>${rows.length?rows.map((s,i)=>`<tr><td class="rank">${i+1}</td><td><strong>${esc(s.name)}</strong><div class="small muted">${esc(s.voice||'')}</div></td><td class="score-cell">${fmtScore(s.score)}</td><td><span class="priority-tag">P${s.roles.indexOf(role.id)+1}</span></td><td>${esc(s.notes||'')}</td></tr>`).join(''):`<tr><td colspan="5" class="muted">No candidates have been assigned to this role yet.</td></tr>`}</tbody></table></div>`;
}

function voteConflicts(){
  const across={}; const within=[];
  Object.entries(state.votes||{}).forEach(([roleId,v])=>{
    const vals=[v?.['1'],v?.['2'],v?.['3']].filter(Boolean); if(new Set(vals).size!==vals.length) within.push(roleId);
    const first=v?.['1']; if(first){if(!across[first])across[first]=[];across[first].push(roleId)}
  });
  return {across:Object.entries(across).filter(([,rs])=>rs.length>1),within};
}
function renderBallot(){
  const conf=voteConflicts();
  let warning='';
  if(conf.across.length || conf.within.length){
    const bits=[];
    conf.across.forEach(([sid,rs])=>bits.push(`${getSinger(sid)?.name||'A singer'} is your #1 choice for ${rs.length} roles`));
    conf.within.forEach(rid=>bits.push(`${getRole(rid)?.name||'A role'} repeats the same singer in more than one vote slot`));
    warning=`<div class="error-note" style="margin-bottom:16px"><strong>Ballot conflict:</strong> ${esc(bits.join(' · '))}</div>`;
  }
  let body='';
  for(const [show,rs] of groupedRoles()){
    body += `<div class="show-title">${esc(show)}</div><div class="table-wrap"><table class="ballot-table"><thead><tr><th>Role</th><th>Suggested 1</th><th>Suggested 2</th><th>Suggested 3</th><th>My #1</th><th>My #2</th><th>My #3</th></tr></thead><tbody>`;
    body += rs.map(r=>{
      const cand=candidateRows(r.id), sug=cand.slice(0,3), vote=state.votes[r.id]||{};
      const hasConflict=conf.within.includes(r.id) || conf.across.some(([,rids])=>rids.includes(r.id));
      return `<tr class="${hasConflict?'conflict-row':''}"><td><strong>${esc(r.name)}</strong><div class="small muted">${esc(r.voice)}</div></td>${[0,1,2].map(i=>`<td class="suggestion">${sug[i]?`<strong>${esc(sug[i].name)}</strong><div class="small muted">${fmtScore(sug[i].score)} · P${sug[i].roles.indexOf(r.id)+1}</div>`:'—'}</td>`).join('')}${[1,2,3].map(rank=>`<td><select data-vote-role="${r.id}" data-vote-rank="${rank}"><option value="">—</option>${cand.map(s=>`<option value="${s.id}" ${vote[String(rank)]===s.id?'selected':''}>${esc(s.name)} · ${fmtScore(s.score)}</option>`).join('')}</select></td>`).join('')}</tr>`;
    }).join('');
    body += '</tbody></table></div>';
  }
  return topbar('Final Ballot','Suggestions come from your rankings; final choices remain explicitly yours.',`<button class="btn" id="exportEvaluations">Export evaluations CSV</button>`) + warning + `<div class="card">${body}</div>`;
}

function renderSetup(){
  const rolesByShow=[...groupedRoles()];
  return topbar('Setup','Prepare the audition day before you begin.',`<button class="btn" id="exportBackup">Export backup</button>`) + `<div class="setup-grid">
    <section class="card"><h2>Audition roster</h2><p class="muted small">Load the day's scheduled singers before the auditions. CSV headers accepted: <strong>Name</strong>, optional <strong>Time</strong> and <strong>Voice</strong>. You can also paste directly from Excel or Numbers as tab-separated text.</p>
      <div class="compact-form"><div class="field full-mobile"><label>Name</label><input id="newName" placeholder="Singer name"></div><div class="field"><label>Time</label><input id="newTime" placeholder="9:00"></div><div class="field"><label>Voice</label><input id="newVoice" placeholder="Soprano"></div><button class="btn primary" id="quickAdd">Add</button></div>
      <div class="actions" style="margin-top:12px"><label class="btn file-label">Import roster CSV<input id="csvInput" type="file" accept=".csv,.tsv,.txt,text/csv,text/tab-separated-values"></label><button class="btn" id="pasteRoster">Paste roster</button><button class="btn" id="loadDemo">Load demo singers</button></div>
      <div class="rule"></div><div class="actions space"><div><strong>${state.singers.length}</strong> singers loaded</div><div class="actions"><button class="btn small-btn" id="sortQueue">Sort by audition time</button><button class="btn small-btn danger" id="clearSingers">Clear roster</button></div></div>
      <div class="rule"></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>Name</th><th>Voice</th><th>Status</th><th>Score</th><th></th></tr></thead><tbody>${state.singers.length?state.singers.map(s=>`<tr><td>${esc(s.time||'')}</td><td><strong>${esc(s.name)}</strong></td><td>${esc(s.voice||'')}</td><td>${statusLabel(s)}</td><td>${Number.isFinite(s.score)?fmtScore(s.score):'—'}</td><td style="text-align:right"><button class="btn small-btn" data-edit-singer="${s.id}">Edit</button> <button class="btn small-btn danger" data-delete-singer="${s.id}">Delete</button></td></tr>`).join(''):`<tr><td colspan="6" class="muted">No singers loaded.</td></tr>`}</tbody></table></div>
    </section>
    <section class="stack">
      <div class="card"><h2>Session</h2><div class="field"><label>Session name</label><input id="sessionName" value="${esc(state.session.name||'')}"></div><div class="field" style="margin-top:10px"><label>Day / label</label><input id="sessionDay" value="${esc(state.session.day||'')}"></div></div>
      <div class="card"><h2>Current-season roles</h2><div class="small muted" style="margin-bottom:10px">${state.roles.length} roles loaded across ${rolesByShow.length} productions.</div>${rolesByShow.map(([show,rs])=>`<div style="margin:12px 0 4px"><strong>${esc(show)}</strong></div>${rs.map(r=>`<div class="small" style="padding:4px 0;border-bottom:1px solid var(--soft)">${esc(r.name)} <span class="muted">· ${esc(r.voice)}</span></div>`).join('')}`).join('')}</div>
      <div class="card"><h2>Backups</h2><p class="small muted">This prototype stores data locally in this browser. Export a JSON backup if you use real audition data.</p><div class="actions"><button class="btn" id="exportBackup2">Export JSON backup</button><label class="btn file-label">Import JSON backup<input id="jsonInput" type="file" accept=".json,application/json"></label></div></div>
    </section>
  </div>`;
}

function render(){
  renderNav(); renderSessionChip();
  const app=document.getElementById('app');
  app.innerHTML = page==='live'?renderLive():page==='roles'?renderRoleBoard():page==='ballot'?renderBallot():renderSetup();
  bind();
}

function bind(){
  document.getElementById('emptyAdd')?.addEventListener('click',()=>openSingerModal());
  document.getElementById('emptyDemo')?.addEventListener('click',()=>loadDemo());
  document.getElementById('emptySetup')?.addEventListener('click',()=>{page='setup';render()});
  document.getElementById('addSinger')?.addEventListener('click',()=>openSingerModal());
  document.getElementById('editSinger')?.addEventListener('click',()=>openSingerModal(currentSingerId));
  document.querySelectorAll('[data-score]').forEach(b=>b.addEventListener('click',()=>{const s=getSinger(currentSingerId);s.score=Number(b.dataset.score);s.status='heard';saveState();render()}));
  document.querySelectorAll('[data-adjust]').forEach(b=>b.addEventListener('click',()=>{const s=getSinger(currentSingerId);let v=Number.isFinite(s.score)?s.score:6;v=Math.round((v+Number(b.dataset.adjust))*10)/10;s.score=Math.min(9,Math.max(3,v));s.status='heard';saveState();render()}));
  document.querySelectorAll('[data-role-index]').forEach(sel=>sel.addEventListener('change',()=>{const s=getSinger(currentSingerId);const i=Number(sel.dataset.roleIndex);const newId=sel.value||null;const arr=[...(s.roles||[])];if(newId){const existing=arr.indexOf(newId);if(existing>=0 && existing!==i) arr[existing]=null}arr[i]=newId;s.roles=arr.slice(0,3);saveState();render()}));
  document.getElementById('notes')?.addEventListener('input',e=>{getSinger(currentSingerId).notes=e.target.value;saveState()});
  document.querySelectorAll('[data-singer]').forEach(el=>el.addEventListener('click',()=>{currentSingerId=el.dataset.singer;render()}));
  document.getElementById('queueSearch')?.addEventListener('input',e=>{queueQuery=e.target.value;const q=queueQuery.trim().toLowerCase();document.querySelectorAll('.queue-item').forEach(el=>{el.style.display=!q||el.dataset.search.includes(q)?'':'none'})});
  document.getElementById('prevSinger')?.addEventListener('click',()=>moveSinger(-1));
  document.getElementById('nextSinger')?.addEventListener('click',()=>{saveState(true);moveSinger(1)});
  document.getElementById('toggleNoShow')?.addEventListener('click',()=>{const s=getSinger(currentSingerId);if(!s)return;if(s.status==='no-show'){s.status=Number.isFinite(s.score)?'heard':'waiting'}else{s.status='no-show'};saveState();render()});
  const rs=document.getElementById('roleSelect'); if(rs) rs.addEventListener('change',()=>{selectedRoleId=rs.value;document.getElementById('roleBoardTable').innerHTML=roleBoardTable(getRole(selectedRoleId),candidateRows(selectedRoleId))});
  document.querySelectorAll('[data-vote-role]').forEach(sel=>sel.addEventListener('change',()=>{const rid=sel.dataset.voteRole, rank=sel.dataset.voteRank;if(!state.votes[rid])state.votes[rid]={};state.votes[rid][rank]=sel.value||'';saveState();const y=window.scrollY;render();requestAnimationFrame(()=>window.scrollTo(0,y))}));
  document.getElementById('exportEvaluations')?.addEventListener('click',exportEvaluationsCSV);
  document.getElementById('quickAdd')?.addEventListener('click',quickAddSinger);
  document.getElementById('newName')?.addEventListener('keydown',e=>{if(e.key==='Enter')quickAddSinger()});
  document.querySelectorAll('[data-edit-singer]').forEach(b=>b.addEventListener('click',()=>openSingerModal(b.dataset.editSinger)));
  document.querySelectorAll('[data-delete-singer]').forEach(b=>b.addEventListener('click',()=>deleteSinger(b.dataset.deleteSinger)));
  document.getElementById('csvInput')?.addEventListener('change',importSingerCSV);
  document.getElementById('loadDemo')?.addEventListener('click',loadDemo);
  document.getElementById('pasteRoster')?.addEventListener('click',openPasteRoster);
  document.getElementById('sortQueue')?.addEventListener('click',sortQueueByTime);
  document.getElementById('clearSingers')?.addEventListener('click',clearSingers);
  document.getElementById('sessionName')?.addEventListener('input',e=>{state.session.name=e.target.value;saveState();renderSessionChip()});
  document.getElementById('sessionDay')?.addEventListener('input',e=>{state.session.day=e.target.value;saveState();renderSessionChip()});
  document.getElementById('exportBackup')?.addEventListener('click',exportBackup);
  document.getElementById('exportBackup2')?.addEventListener('click',exportBackup);
  document.getElementById('jsonInput')?.addEventListener('change',importBackup);
  document.getElementById('clearSingers')?.addEventListener('click',clearSingers);
}
function moveSinger(delta){const i=state.singers.findIndex(s=>s.id===currentSingerId);if(i<0)return;const ni=Math.min(state.singers.length-1,Math.max(0,i+delta));currentSingerId=state.singers[ni].id;render()}
function quickAddSinger(){const name=document.getElementById('newName')?.value.trim();if(!name){toast('Enter a singer name');return}addSinger({name,time:document.getElementById('newTime')?.value.trim()||'',voice:document.getElementById('newVoice')?.value.trim()||''});document.getElementById('newName').value='';document.getElementById('newTime').value='';document.getElementById('newVoice').value='';render()}
function addSinger(data){const s={id:uid('s'),name:data.name||'Untitled singer',time:data.time||'',voice:data.voice||'',score:null,roles:[],notes:'',status:data.status||'waiting',order:state.singers.length+1};state.singers.push(s);currentSingerId=s.id;saveState();return s}
function deleteSinger(id){const s=getSinger(id);if(!s)return;if(!confirm(`Delete ${s.name} and this singer's evaluation?`))return;state.singers=state.singers.filter(x=>x.id!==id);Object.values(state.votes||{}).forEach(v=>{['1','2','3'].forEach(k=>{if(v[k]===id)v[k]=''})});if(currentSingerId===id)currentSingerId=state.singers[0]?.id||null;saveState();render()}
function openSingerModal(id=null){
  const existing=id?getSinger(id):null;
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>${existing?'Edit singer':'Add singer'}</h2><p>${existing?'Changes preserve the evaluation and ranking.':'Add one person to the audition queue.'}</p><div class="field-row three"><div class="field"><label>Name</label><input id="modalName" value="${esc(existing?.name||'')}" autofocus></div><div class="field"><label>Time</label><input id="modalTime" value="${esc(existing?.time||'')}" placeholder="9:00"></div><div class="field"><label>Voice</label><input id="modalVoice" value="${esc(existing?.voice||'')}" placeholder="Soprano"></div></div><div class="actions end" style="margin-top:18px"><button class="btn" id="modalCancel">Cancel</button><button class="btn primary" id="modalSave">${existing?'Save changes':'Add singer'}</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('modalCancel').onclick=close;
  document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')close()});
  document.getElementById('modalSave').onclick=()=>{const name=document.getElementById('modalName').value.trim();if(!name){toast('Name is required');return}const data={name,time:document.getElementById('modalTime').value.trim(),voice:document.getElementById('modalVoice').value.trim()};if(existing){Object.assign(existing,data);saveState()}else addSinger(data);close();render()};
  document.getElementById('modalName').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('modalSave').click()});
  setTimeout(()=>document.getElementById('modalName')?.focus(),0);
}
function loadDemo(){if(state.singers.length && !confirm('Append demo singers to the existing queue?'))return;const incoming=demoSingers().map((s,i)=>({...s,id:uid('d'),order:state.singers.length+i+1}));state.singers.push(...incoming);currentSingerId=currentSingerId||incoming[0]?.id;saveState();toast('Demo singers loaded');render()}
function clearSingers(){if(!confirm('Clear all singers, evaluations, notes, and final votes? The role list will remain.'))return;state.singers=[];state.votes={};currentSingerId=null;saveState();render();toast('Audition data cleared')}

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}
  }
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function importSingerCSV(e){const file=e.target.files?.[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const imported=rowsToSingers(parseDelimited(String(fr.result)));if(!imported.length)throw new Error('No singer rows found');if(state.singers.length&&!confirm(`Replace the current roster with ${imported.length} singers?`))return;state.singers=imported;state.votes={};currentSingerId=state.singers[0]?.id||null;saveState();toast(`${imported.length} singers imported`);render()}catch(err){alert(`Could not import roster: ${err.message}`)}finally{e.target.value=''}};fr.readAsText(file)}

function exportBackup(){downloadText(`audition-desk-backup-${dateStamp()}.json`,JSON.stringify(state,null,2),'application/json');toast('Backup exported')}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const x=JSON.parse(String(fr.result));if(!Array.isArray(x.roles)||!Array.isArray(x.singers))throw new Error('Not an Audition Desk backup');state=x;currentSingerId=state.singers[0]?.id||null;saveState();toast('Backup imported');render()}catch(err){alert(`Could not import backup: ${err.message}`)}finally{e.target.value=''}};fr.readAsText(file)}
function exportEvaluationsCSV(){const head=['Order','Time','Name','Voice','Status','Score','Role 1','Role 2','Role 3','Notes'];const lines=[head,...state.singers.map(s=>[s.order||'',s.time||'',s.name||'',s.voice||'',s.status||'waiting',Number.isFinite(s.score)?s.score:'',...( [0,1,2].map(i=>{const r=getRole(s.roles?.[i]);return r?`${r.show} — ${r.name}`:''}) ),s.notes||''])].map(r=>r.map(csvCell).join(','));downloadText(`audition-evaluations-${dateStamp()}.csv`,lines.join('\r\n'),'text/csv;charset=utf-8');toast('Evaluations CSV exported')}
function csvCell(v){const s=String(v??'');return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function downloadText(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if(root.textContent===msg)root.innerHTML=''},2200)}

// Optional demo URL for quick screenshots/testing: AuditionDesk.html?demo=1
if(new URLSearchParams(location.search).get('demo')==='1' && !state.singers.length){state.singers=demoSingers();currentSingerId=state.singers[0].id;saveState()}
render();
})();
</script>
</body>
