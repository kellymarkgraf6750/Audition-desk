<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Audition Desk — Local Prototype v8</title>
<style>
:root{
  --bg:#f4f4f1; --panel:#ffffff; --ink:#111111; --muted:#6d6d68; --line:#d9d9d3;
  --soft:#ecece7; --soft2:#f8f8f5; --danger:#8e2d2d; --danger-bg:#f8eaea;
  --warn:#745714; --warn-bg:#fff5d9; --ok:#28613c; --ok-bg:#e9f5ed; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #111;outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(0,1fr)}
aside{position:sticky;top:0;height:100vh;background:#fafaf7;border-right:1px solid var(--line);padding:20px 14px;z-index:4}
.brand{padding:2px 10px 18px;font-size:15px;font-weight:760;letter-spacing:.09em;text-transform:uppercase}
.session-chip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 10px;margin-bottom:12px}
.session-chip small{display:block;color:var(--muted)}.session-chip strong{display:block;margin-top:3px}.session-chip span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
nav{display:grid;gap:4px}nav button{appearance:none;border:0;border-radius:7px;background:transparent;text-align:left;padding:10px;color:#333}nav button.active{background:#111;color:#fff}
.aside-foot{position:absolute;left:24px;right:18px;bottom:18px;color:var(--muted);font-size:12px}
main{padding:26px 30px 52px;max-width:1380px;width:100%}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.topbar h1{font-size:25px;line-height:1.15;margin:0;font-weight:690}.topbar p{color:var(--muted);margin:6px 0 0}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 9px;color:var(--muted);font-size:12px;white-space:nowrap}.dot{width:7px;height:7px;border-radius:50%;background:#666}.dot.ok{background:#34754a}.dot.warn{background:#a3750d}
.grid{display:grid;gap:16px}.g2{grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr)}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}.card h2,.card h3{margin:0 0 12px}.card h2{font-size:16px}.card h3{font-size:14px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}.rule{height:1px;background:var(--line);margin:16px 0}.hidden{display:none!important}
.btn{appearance:none;border:1px solid #bdbdb7;background:#fff;border-radius:7px;padding:9px 13px;font-weight:590}.btn:hover{background:#f7f7f4}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.primary:hover{background:#252525}.btn.danger{color:var(--danger);border-color:#d6b4b4}.btn.ghost{border-color:transparent;background:transparent}.btn.small-btn{padding:6px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:default}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}input,select,textarea{width:100%;border:1px solid #c9c9c3;border-radius:7px;background:#fff;padding:10px}textarea{min-height:112px;resize:vertical}.field{min-width:0}.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field-row.three{grid-template-columns:1.2fr .7fr .8fr}
.singer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.singer-name{font-size:30px;line-height:1.1;font-weight:680;margin:0}.singer-meta{margin-top:5px;color:var(--muted)}
.score-wrap{display:grid;gap:10px}.score-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.score-button{height:50px;border:1px solid #bdbdb7;background:#fff;border-radius:7px;font-weight:700;font-size:16px}.score-button.selected{background:#111;color:#fff;border-color:#111}.score-fine{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}.score-value{font-size:20px;font-weight:720;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}.fine-actions{display:flex;gap:6px}.fine-actions button{width:38px;height:34px;border:1px solid #c5c5bf;background:#fff;border-radius:6px;font-weight:700}
.role-stack{display:grid;gap:8px}.role-field{display:grid;grid-template-columns:38px 1fr;gap:7px;align-items:center}.priority{height:40px;display:flex;align-items:center;justify-content:center;border-radius:7px;background:var(--soft);color:#555;font-size:12px;font-weight:700}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions.end{justify-content:flex-end}.actions.space{justify-content:space-between}
.queue-tools{display:flex;gap:8px;margin-bottom:10px}.queue-tools input{padding:8px}.queue{display:grid;gap:2px;max-height:610px;overflow:auto}.queue-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;padding:9px 8px;border-radius:6px;align-items:center;cursor:pointer}.queue-item:hover{background:#f7f7f4}.queue-item.current{background:#ededE8}.queue-item .time{color:var(--muted);font-variant-numeric:tabular-nums}.queue-item .qname{font-weight:640;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-score{min-width:34px;text-align:center;border:1px solid var(--line);border-radius:999px;padding:3px 7px;font-size:12px;font-weight:680;background:#fff}
.status-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}.status-tag.waiting{color:#666;background:#f7f7f4}.status-tag.heard{color:#244e31;background:var(--ok-bg);border-color:#bcd9c4}.status-tag.no-show{color:#6d2929;background:var(--danger-bg);border-color:#ddbcbc}
.note{background:var(--warn-bg);border:1px solid #e8d493;border-radius:7px;padding:10px 12px;color:#4e421f}.ok-note{background:var(--ok-bg);border:1px solid #bcd9c4;border-radius:7px;padding:10px 12px;color:#234c31}.error-note{background:var(--danger-bg);border:1px solid #ddbcbc;border-radius:7px;padding:10px 12px;color:#6d2929}
table{width:100%;border-collapse:collapse}th,td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:12px;color:var(--muted);font-weight:650;position:sticky;top:0;background:var(--panel);z-index:1}.score-cell{text-align:right;font-weight:720;font-variant-numeric:tabular-nums}.rank{width:34px;color:var(--muted)}.priority-tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:11px;color:var(--muted);background:#fff}.cast-badge{color:#333}.follow-badge{color:#5b4a16;background:#fff5d9;border-color:#e1cf87}.singer-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.cast-detail{color:var(--muted);font-size:11px;margin-top:3px}.table-wrap{overflow:auto;max-width:100%}
.show-title{font-size:14px;font-weight:750;margin:18px 0 8px;padding-top:2px}.show-title:first-child{margin-top:0}.ballot-table select{min-width:140px;padding:7px}.suggestion strong{font-weight:680}.suggestion .small{margin-top:2px}.conflict-row{background:#fff4f4}
.empty{padding:42px 20px;text-align:center}.empty h2{margin:0 0 6px;font-size:19px}.empty p{margin:0 auto 18px;color:var(--muted);max-width:560px}
.setup-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:16px}.stack{display:grid;gap:12px}.compact-form{display:grid;grid-template-columns:1.2fr .8fr .8fr auto;gap:8px;align-items:end}.file-label{display:inline-flex;align-items:center;justify-content:center}.file-label input{display:none}
.file-picker{padding:7px;background:#fff;font-size:12px}.summary-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0}.summary-box{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--soft2)}.summary-box strong{display:block;font-size:19px}.json-preview{width:100%;min-height:180px;font:11px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:center;justify-content:center;padding:18px;z-index:30}.modal{width:min(560px,100%);background:#fff;border:1px solid #bbb;border-radius:12px;padding:20px;box-shadow:0 18px 60px rgba(0,0,0,.25)}.modal h2{margin:0 0 4px;font-size:20px}.modal p{margin:0 0 16px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;border-radius:8px;padding:10px 12px;font-size:13px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.kbd{border:1px solid #c9c9c3;border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff;font-size:11px;color:#555}
@media(max-width:900px){
  .app{grid-template-columns:1fr}aside{position:sticky;height:auto;padding:10px 10px 9px;border-right:0;border-bottom:1px solid var(--line)}.brand,.session-chip,.aside-foot{display:none}nav{grid-template-columns:repeat(4,1fr)}nav button{text-align:center;padding:8px 4px;font-size:12px}main{padding:18px 14px 44px}.g2,.g3,.setup-grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.topbar h1{font-size:22px}.score-row{gap:5px}.score-button{height:46px}.field-row.three{grid-template-columns:1fr 1fr}.compact-form{grid-template-columns:1fr 1fr}.compact-form .full-mobile{grid-column:1/-1}
}
@media(max-width:560px){.field-row,.field-row.three{grid-template-columns:1fr}.singer-name{font-size:25px}.queue{max-height:420px}.topbar{display:block}.top-actions{justify-content:flex-start;margin-top:10px}.score-row{grid-template-columns:repeat(7,1fr)}.score-button{font-size:14px;padding:0}.compact-form{grid-template-columns:1fr}.compact-form .full-mobile{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Audition Desk</div>
    <div class="session-chip" id="sessionChip"></div>
    <nav id="nav"></nav>
    <div class="aside-foot">Local prototype v8 · browser autosave</div>
  </aside>
  <main id="app"></main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY = 'auditionDeskLocalV3';
const LEGACY_STORAGE_KEY = 'auditionDeskLocalV2';
const pages = [['live','Live Entry'],['roles','Role Board'],['ballot','Final Ballot'],['setup','Setup']];
const roles = [
  ['r1','Madama Butterfly','Cio-Cio-San','Soprano'],['r2','Madama Butterfly','Lt. Pinkerton','Tenor'],['r3','Madama Butterfly','Suzuki','Mezzo-Soprano'],['r4','Madama Butterfly','Sharpless','Baritone'],['r5','Madama Butterfly','Goro','Tenor'],['r6','Madama Butterfly','Prince Yamadori','Baritone'],['r7','Madama Butterfly','The Bonze','Bass'],['r8','Madama Butterfly','The Imperial Commissioner','Bass'],['r9','Madama Butterfly','Kate Pinkerton','Mezzo-Soprano'],['r10','Madama Butterfly','The Official Registrar','Baritone'],
  ['r11','Die lustigen Weiber von Windsor','Frau Fluth','Soprano'],['r12','Die lustigen Weiber von Windsor','Herr Fluth','Baritone'],['r13','Die lustigen Weiber von Windsor','Sir John Falstaff','Bass'],['r14','Die lustigen Weiber von Windsor','Anne Reich','Soprano'],['r15','Die lustigen Weiber von Windsor','Frau Reich','Mezzo-Soprano'],['r16','Die lustigen Weiber von Windsor','Fenton','Tenor'],['r17','Die lustigen Weiber von Windsor','Junker Spärlich','Tenor'],['r18','Die lustigen Weiber von Windsor','Herr Reich','Bass'],['r19','Die lustigen Weiber von Windsor','Dr. Caius','Bass'],
  ['r20','The Snowy Day','Peter','Soprano'],['r21','The Snowy Day','Amy / Ensemble Soprano 1','Soprano'],['r22','The Snowy Day','Mama / Ensemble Soprano 2','Soprano'],['r23','The Snowy Day','Jasper / Ensemble Tenor','Tenor'],['r24','The Snowy Day','Papi / Ensemble Tenor','Tenor'],['r25','The Snowy Day','Daddy / Ensemble Bass 1','Bass'],['r26','The Snowy Day','Tim / Ensemble Bass 1','Bass-Baritone'],['r27','The Snowy Day','Billy / Ensemble Bass 2','Bass']
].map(([id,show,name,voice]) => ({id,show,name,voice}));

function freshState(){return {version:3,session:{name:'Current Season Auditions',day:'Audition Day'},roles:roles.map(r=>({...r})),singers:[],votes:{},castList:[]}}
function demoSingers(){return [
  ['s1','9:00','Demo Singer 01','Soprano',8.6,['r1','r11','r14'],'Focused, confident; strongest dramatic impression so far.'],
  ['s2','9:06','Demo Singer 02','Soprano',8.2,['r11','r14','r20'],'Very clean singing; lighter dramatic profile.'],
  ['s3','9:12','Demo Singer 03','Tenor',8.4,['r2','r16','r17'],'Easy top; persuasive text.'],
  ['s4','9:18','Demo Singer 04','Mezzo-Soprano',8.1,['r3','r15','r9'],'Warm center; natural actor.'],
  ['s5','9:24','Demo Singer 05','Baritone',7.8,['r4','r12','r6'],'Good authority; compare directly with Singer 09.'],
  ['s6','9:30','Demo Singer 06','Bass',8.3,['r13','r18','r7'],'Excellent character instincts and resonance.'],
  ['s7','9:36','Demo Singer 07','Soprano',8.8,['r20','r21','r22'],'Exceptional musical specificity.'],
  ['s8','9:42','Demo Singer 08','Tenor',7.7,['r23','r24','r5'],'Strong actor; vocal fit less clear.'],
  ['s9','9:48','Demo Singer 09','Baritone',8.0,['r12','r4','r10'],'Strongest for Herr Fluth; good comic timing.'],
  ['s10','9:54','Demo Singer 10','Bass-Baritone',8.5,['r26','r25','r27'],'Flexible enough for several Snowy Day assignments.']
].map((x,i)=>({id:x[0],time:x[1],name:x[2],voice:x[3],score:x[4],roles:x[5],notes:x[6],status:'heard',order:i+1}))}

let storageAvailable = true;
let lastSaved = null;
function loadState(){
  try{
    let raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) raw = localStorage.getItem(LEGACY_STORAGE_KEY);
    if(!raw) return freshState();
    const parsed = JSON.parse(raw);
    if(!parsed.roles || !parsed.singers) return freshState();
    parsed.version = 3;
    parsed.castList = Array.isArray(parsed.castList) ? parsed.castList : [];
    parsed.singers = parsed.singers.map((s,i)=>({
      ...s,
      status: s.status || (Number.isFinite(s.score) ? 'heard' : 'waiting'),
      order: s.order || i+1,
      followUp: !!s.followUp,
      followUpReason: s.followUpReason || ''
    }));
    parsed.singers.forEach(s=>{delete s.decision});
    return parsed;
  }catch(e){storageAvailable=false; return freshState()}
}
let state = loadState();
let page = 'live';
let currentSingerId = state.singers[0]?.id || null;
let selectedRoleId = state.roles[0]?.id || null;
let queueQuery = '';
let followUpOnly = false;

function saveState(showToast=false){
  lastSaved = new Date();
  try{localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); storageAvailable=true}
  catch(e){storageAvailable=false}
  renderSessionChip();
  if(showToast) toast(storageAvailable ? 'Saved locally' : 'Working in this tab only — export a backup');
}
function esc(value){return String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function uid(prefix='x'){return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,7)}
function fmtScore(v){return Number.isFinite(v) ? Number(v).toFixed(1) : '—'}
function getRole(id){return state.roles.find(r=>r.id===id)}
function getSinger(id){return state.singers.find(s=>s.id===id)}
function normalizeName(v){return String(v||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function castEntriesForSinger(s){const key=normalizeName(s?.name);return key?state.castList.filter(c=>normalizeName(c.name)===key):[]}
function isCurrentlyCast(s){return castEntriesForSinger(s).length>0}
function castBadge(s){const entries=castEntriesForSinger(s); if(!entries.length) return ''; const shows=[...new Set(entries.map(e=>e.show).filter(Boolean))]; const detail=shows.length?` title="Currently cast in: ${esc(shows.join('; '))}"`:''; return `<span class="badge cast-badge"${detail}>🎭 Currently Cast</span>`}
function followUpBadge(s){return s?.followUp?`<span class="badge follow-badge" title="Flagged for follow-up">⚑ Follow-up</span>`:''}
function candidateMarker(s){return `${castBadge(s)}${followUpBadge(s)}`}
function groupedRoles(){const map=new Map();state.roles.forEach(r=>{if(!map.has(r.show))map.set(r.show,[]);map.get(r.show).push(r)});return map}
function roleOptions(selected='', includeNone=true){
  let html = includeNone ? '<option value="">— none —</option>' : '';
  for(const [show,rs] of groupedRoles()) html += `<optgroup label="${esc(show)}">${rs.map(r=>`<option value="${r.id}" ${r.id===selected?'selected':''}>${esc(r.name)} — ${esc(r.voice)}</option>`).join('')}</optgroup>`;
  return html;
}
function candidateRows(roleId){
  return state.singers.filter(s=>s.roles?.includes(roleId) && Number.isFinite(s.score)).sort((a,b)=>{
    if(b.score!==a.score) return b.score-a.score;
    const ap=a.roles.indexOf(roleId), bp=b.roles.indexOf(roleId);
    if(ap!==bp) return ap-bp;
    return (a.order||0)-(b.order||0);
  });
}
function renderNav(){
  document.getElementById('nav').innerHTML = pages.map(([id,label])=>`<button class="${page===id?'active':''}" data-page="${id}">${label}</button>`).join('');
  document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{page=b.dataset.page;render()}));
}
function renderSessionChip(){
  const el=document.getElementById('sessionChip'); if(!el) return;
  const saveText = storageAvailable ? (lastSaved ? `Saved ${lastSaved.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}` : 'Local autosave ready') : 'Storage blocked — export backups';
  el.innerHTML=`<small>Current session</small><strong>${esc(state.session.name||'Auditions')}</strong><span>${esc(state.session.day||'')} · ${esc(saveText)}</span>`;
}
function storageBadge(){return `<span class="badge"><span class="dot ${storageAvailable?'ok':'warn'}"></span>${storageAvailable?'local autosave':'session-only storage'}</span>`}
function topbar(title,subtitle,extra=''){return `<div class="topbar"><div><h1>${esc(title)}</h1><p>${esc(subtitle)}</p></div><div class="top-actions">${storageBadge()}${extra}</div></div>`}

function statusLabel(s){
  if(s.status==='no-show') return '<span class="status-tag no-show">No-show</span>';
  if(Number.isFinite(s.score)) return '<span class="status-tag heard">Heard</span>';
  return '<span class="status-tag waiting">Waiting</span>';
}
function renderLive(){
  if(!state.singers.length){
    return topbar('Live Entry','One singer at a time; ranking happens automatically.') + `<div class="card empty"><h2>No singers loaded yet</h2><p>Load today's audition roster in Setup, or add the first singer here. Current-season roles are already loaded.</p><div class="actions" style="justify-content:center"><button class="btn primary" id="emptyAdd">Add first singer</button><button class="btn" id="emptyDemo">Load demo singers</button><button class="btn" id="emptySetup">Go to Setup</button></div></div>`;
  }
  if(!currentSingerId || !getSinger(currentSingerId)) currentSingerId=state.singers[0].id;
  const s=getSinger(currentSingerId); const idx=state.singers.findIndex(x=>x.id===s.id);
  const liveCard=`<section class="card">
    <div class="singer-head"><div><h2 class="singer-name">${esc(s.name)}</h2><div class="singer-meta">${esc(s.time||'No time')} · ${esc(s.voice||'Voice not set')}</div><div class="singer-badges">${candidateMarker(s)}</div>${isCurrentlyCast(s)?`<div class="cast-detail">This singer appears on the imported current-semester cast list. This badge does not affect ranking or voting.</div>`:''}</div><div class="actions"><span class="badge">${s.status==='no-show'?'No-show':Number.isFinite(s.score)?'Heard':'Waiting'}</span><button class="btn small-btn" id="editSinger">Edit singer</button></div></div>
    <div class="rule"></div>
    <div class="score-wrap"><label>Score · 3.0 to 9.0</label><div class="score-row">${[3,4,5,6,7,8,9].map(n=>`<button class="score-button ${Number.isFinite(s.score)&&Math.floor(s.score)===n?'selected':''}" data-score="${n}" ${s.status==='no-show'?'disabled':''}>${n}</button>`).join('')}</div>
      <div class="score-fine"><span class="small muted">Fine adjustment</span><div class="fine-actions"><button data-adjust="-0.1" aria-label="Decrease score by 0.1" ${s.status==='no-show'?'disabled':''}>−</button><div class="score-value" id="scoreValue">${fmtScore(s.score)}</div><button data-adjust="0.1" aria-label="Increase score by 0.1" ${s.status==='no-show'?'disabled':''}>+</button></div></div>
    </div>
    <div style="margin-top:18px"><label>Possible roles · ordered by casting precedence</label><div class="role-stack">${[0,1,2].map(i=>`<div class="role-field"><div class="priority">P${i+1}</div><select data-role-index="${i}" ${s.status==='no-show'?'disabled':''}>${roleOptions(s.roles?.[i]||'',true)}</select></div>`).join('')}</div></div>
    <div style="margin-top:18px"><label>Notes</label><textarea id="notes" placeholder="What will matter when you are voting several hours from now?" ${s.status==='no-show'?'disabled':''}>${esc(s.notes||'')}</textarea></div>
    <div class="actions space" style="margin-top:12px"><div class="actions"><button class="btn ${s.followUp?'primary':''} small-btn" id="toggleFollowUp">${s.followUp?'⚑ Follow-up flagged':'⚐ Flag for follow-up'}</button>${s.followUp&&s.followUpReason?`<span class="small muted">${esc(s.followUpReason)}</span>`:''}</div><span class="small muted">Use this for anything you need to revisit later.</span></div>

function voteConflicts(){
  const across={}; const within=[];
  Object.entries(state.votes||{}).forEach(([roleId,v])=>{
    const vals=[v?.['1'],v?.['2'],v?.['3']].filter(Boolean); if(new Set(vals).size!==vals.length) within.push(roleId);
    const first=v?.['1']; if(first){if(!across[first])across[first]=[];across[first].push(roleId)}
  });
  return {across:Object.entries(across).filter(([,rs])=>rs.length>1),within};
}
function renderBallot(){
  const conf=voteConflicts();
  let warning='';
  if(conf.across.length || conf.within.length){
    const bits=[];
    conf.across.forEach(([sid,rs])=>bits.push(`${getSinger(sid)?.name||'A singer'} is your #1 choice for ${rs.length} roles`));
    conf.within.forEach(rid=>bits.push(`${getRole(rid)?.name||'A role'} repeats the same singer in more than one vote slot`));
    warning=`<div class="error-note" style="margin-bottom:16px"><strong>Ballot conflict:</strong> ${esc(bits.join(' · '))}</div>`;
  }
  let body='';
  for(const [show,rs] of groupedRoles()){
    body += `<div class="show-title">${esc(show)}</div><div class="table-wrap"><table class="ballot-table"><thead><tr><th>Role</th><th>Suggested 1</th><th>Suggested 2</th><th>Suggested 3</th><th>My #1</th><th>My #2</th><th>My #3</th></tr></thead><tbody>`;
    body += rs.map(r=>{
      const cand=candidateRows(r.id), sug=cand.slice(0,3), vote=state.votes[r.id]||{};
      const hasConflict=conf.within.includes(r.id) || conf.across.some(([,rids])=>rids.includes(r.id));
      return `<tr class="${hasConflict?'conflict-row':''}"><td><strong>${esc(r.name)}</strong><div class="small muted">${esc(r.voice)}</div></td>${[0,1,2].map(i=>`<td class="suggestion">${sug[i]?`<strong>${esc(sug[i].name)}</strong><div class="small muted">${fmtScore(sug[i].score)} · P${sug[i].roles.indexOf(r.id)+1}</div><div class="singer-badges">${candidateMarker(sug[i])}</div>`:'—'}</td>`).join('')}${[1,2,3].map(rank=>`<td><select data-vote-role="${r.id}" data-vote-rank="${rank}"><option value="">—</option>${cand.map(s=>`<option value="${s.id}" ${vote[String(rank)]===s.id?'selected':''}>${isCurrentlyCast(s)?'🎭 ':''}${s.followUp?'⚑ ':''}${esc(s.name)} · ${fmtScore(s.score)}</option>`).join('')}</select></td>`).join('')}</tr>`;
    }).join('');
    body += '</tbody></table></div>';
  }
  return topbar('Final Ballot','Suggestions come from your rankings; final choices remain explicitly yours.',`<button class="btn" id="exportEvaluations">Export evaluations CSV</button>`) + warning + `<div class="card">${body}</div>`;
}

function moveSinger(delta){const i=state.singers.findIndex(s=>s.id===currentSingerId);if(i<0)return;const ni=Math.min(state.singers.length-1,Math.max(0,i+delta));currentSingerId=state.singers[ni].id;render()}

function sortQueueByTime(){
  state.singers.sort((a,b)=>{
    const ta=String(a.time||'').trim(), tb=String(b.time||'').trim();
    const pa=ta.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i), pb=tb.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)?$/i);
    function minutes(m){if(!m)return Number.POSITIVE_INFINITY;let h=Number(m[1]), min=Number(m[2]||0), ap=(m[3]||'').toLowerCase();if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+min}
    return minutes(pa)-minutes(pb);
  });
  state.singers.forEach((s,i)=>s.order=i+1);
  currentSingerId=state.singers.find(s=>s.id===currentSingerId)?.id||state.singers[0]?.id||null;
  saveState(); render(); toast('Queue sorted by audition time');
}

function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
    else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}
  }
  if(cell.length||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function rowsToSingers(rows){
  if(!rows.length)return [];
  const first=rows[0].map(normalizeHeader);
  const hasHeader=first.some(h=>['name','singer','student','performer'].includes(h));
  const start=hasHeader?1:0;
  let nameIdx=hasHeader?first.findIndex(h=>['name','singer','student','performer'].includes(h)):0;
  let timeIdx=hasHeader?first.findIndex(h=>['time','auditiontime','audition'].includes(h)):-1;
  let voiceIdx=hasHeader?first.findIndex(h=>['voice','voicetype','fach'].includes(h)):2;
  if(nameIdx<0)nameIdx=0;
  return rows.slice(start).map((r,i)=>({
    id:uid('s'),
    name:String(r[nameIdx]||'').trim(),
    time:String(timeIdx>=0?(r[timeIdx]||''):'').trim(),
    voice:String(voiceIdx>=0?(r[voiceIdx]||''):'').trim(),
    score:null,
    roles:[],
    notes:'',
    followUp:false,
    followUpReason:'',
    status:'waiting',
    order:i+1
  })).filter(x=>x.name);
}
function openPasteRoster(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="pasteRosterBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Paste audition roster</h2><p>Copy rows from Excel or Numbers and paste them below. Use columns: <strong>Name</strong>, optional <strong>Time</strong> and <strong>Voice</strong>. The first row may be a header.</p><textarea id="rosterPaste" style="min-height:220px" placeholder="Name\tTime\tVoice\nJane Smith\t9:00\tSoprano\nJohn Brown\t9:06\tTenor"></textarea><div class="actions end" style="margin-top:14px"><button class="btn" id="rosterCancel">Cancel</button><button class="btn primary" id="rosterSave">Load roster</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('rosterCancel').onclick=close;
  document.getElementById('pasteRosterBackdrop').addEventListener('click',e=>{if(e.target.id==='pasteRosterBackdrop')close()});
  document.getElementById('rosterSave').onclick=()=>{
    try{
      const text=document.getElementById('rosterPaste').value;
      const imported=rowsToSingers(parseDelimited(text));
      if(!imported.length)throw new Error('No singer rows found. Expected Name, Time, and Voice columns or tab-separated rows.');
      if(state.singers.length&&!confirm(`Replace the current roster with ${imported.length} singers?`))return;
      state.singers=imported;
      state.votes={};
      currentSingerId=state.singers[0]?.id||null;
      saveState();
      close();

      render();
    }catch(err){alert(err.message)}
  };
  setTimeout(()=>document.getElementById('rosterPaste')?.focus(),0);
}
function importSingerCSV(e){const file=e.target.files?.[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const imported=rowsToSingers(parseDelimited(String(fr.result)));if(!imported.length)throw new Error('No singer rows found');if(state.singers.length&&!confirm(`Replace the current roster with ${imported.length} singers?`))return;state.singers=imported;state.votes={};currentSingerId=state.singers[0]?.id||null;saveState();toast(`${imported.length} singers imported`);render()}catch(err){alert(`Could not import roster: ${err.message}`)}finally{e.target.value=''}};fr.readAsText(file)}

function normalizeHeader(h){return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'')}
function rowsToCast(rows){
  if(!rows.length)return [];
  const first=rows[0].map(normalizeHeader);
  const hasHeader=first.some(h=>['name','singer','student','performer'].includes(h));
  let start=hasHeader?1:0;
  let nameIdx=hasHeader?first.findIndex(h=>['name','singer','student','performer'].includes(h)):0;
  let showIdx=hasHeader?first.findIndex(h=>['show','opera','production'].includes(h)):-1;
  let roleIdx=hasHeader?first.findIndex(h=>['role','part'].includes(h)):1;
  if(nameIdx<0)nameIdx=0;
  return rows.slice(start).map(r=>({name:String(r[nameIdx]||'').trim(),show:String(r[showIdx]||'').trim(),role:String(r[roleIdx]||'').trim()})).filter(x=>x.name);
}
function parseDelimited(text){
  const lines=String(text||'').split(/\r?\n/).filter(x=>x.trim());
  if(!lines.length)return [];
  const delim=lines[0].includes('\t')?'\t':',';
  return lines.map(line=>line.split(delim).map(c=>c.replace(/^\s+|\s+$/g,'')));
}
function parseCastText(text){
  const raw=String(text||'');
  const rows=raw.includes('\t')||raw.includes(',')?parseCSV(raw):raw.split(/\r?\n/).filter(Boolean).map(line=>line.split(/\s+[—-]\s+/));
  return rowsToCast(rows);
}
function importCastList(e){const file=e.target.files?.[0];if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const cast=rowsToCast(file.name.toLowerCase().endsWith('.csv')?parseCSV(String(fr.result)):parseDelimited(String(fr.result)));if(!cast.length)throw new Error('No cast entries found. Expected a Name column (plus optional Show and Role).');state.castList=cast;saveState();toast(`${cast.length} cast entries loaded`);render()}catch(err){alert(`Could not import cast list: ${err.message}`)}finally{e.target.value=''}};fr.readAsText(file)}
function openPasteCast(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="castModalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Paste cast list</h2><p>Paste rows copied from a spreadsheet. Use columns: Name, Show, Role. The first row may be a header.</p><textarea id="castPaste" style="min-height:190px" placeholder="Name\tShow\tRole\nJane Smith\tMadama Butterfly\tCio-Cio-San"></textarea><div class="actions end" style="margin-top:14px"><button class="btn" id="castCancel">Cancel</button><button class="btn primary" id="castSave">Load cast list</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('castCancel').onclick=close;
  document.getElementById('castModalBackdrop').addEventListener('click',e=>{if(e.target.id==='castModalBackdrop')close()});
  document.getElementById('castSave').onclick=()=>{try{const cast=rowsToCast(parseDelimited(document.getElementById('castPaste').value));if(!cast.length)throw new Error('No cast entries found.');state.castList=cast;saveState();close();toast(`${cast.length} cast entries loaded`);render()}catch(err){alert(err.message)}};
  setTimeout(()=>document.getElementById('castPaste')?.focus(),0);
}
function downloadCastTemplate(){downloadText('audition-desk-cast-list-template.csv','Name,Show,Role\r\nJane Smith,Madama Butterfly,Cio-Cio-San\r\n','text/csv;charset=utf-8');toast('Cast list template downloaded')}
function clearCastList(){if(!state.castList.length)return;if(!confirm('Clear the current-semester cast list? The 🎭 badges will disappear, but singer evaluations will remain.'))return;state.castList=[];saveState();render();toast('Cast list cleared')}

function backupText(){return JSON.stringify(state,null,2)}
function backupFileName(){return `audition-desk-backup-${dateStamp()}.json`}
async function copyTextReliable(text){
  try{if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return true}}catch(e){}
  try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);const ok=document.execCommand('copy');ta.remove();return !!ok}catch(e){return false}
}
async function copyBackupJSON(){const ok=await copyTextReliable(backupText());toast(ok?'Backup JSON copied':'Could not copy automatically — use Backup / Restore')}
function openBackupExportModal(){
  const text=backupText(), name=backupFileName();
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="backupModalBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Back up AuditionDesk</h2><p>On iPad, <strong>Share / Save</strong> is the most reliable option: choose Save to Files from the iPad share sheet. Download and copy are also available as fallbacks.</p><div class="summary-grid"><div class="summary-box"><span class="small muted">Singers</span><strong>${state.singers.length}</strong></div><div class="summary-box"><span class="small muted">Scored</span><strong>${state.singers.filter(s=>Number.isFinite(s.score)).length}</strong></div></div><div class="actions"><button class="btn primary" id="shareBackup">Share / Save</button><button class="btn" id="downloadBackup">Download</button><button class="btn" id="copyBackupModal">Copy JSON</button></div><div class="rule"></div><details><summary class="small">Show backup text</summary><textarea class="json-preview" id="backupPreview" readonly>${esc(text)}</textarea></details><div class="actions end" style="margin-top:16px"><button class="btn" id="backupClose">Close</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('backupClose').onclick=close;
  document.getElementById('backupModalBackdrop').addEventListener('click',e=>{if(e.target.id==='backupModalBackdrop')close()});
  document.getElementById('downloadBackup').onclick=()=>{downloadText(name,text,'application/json');toast('Download requested')};
  document.getElementById('copyBackupModal').onclick=async()=>{const ok=await copyTextReliable(text);toast(ok?'Backup JSON copied':'Copy failed — select the backup text manually')};
  document.getElementById('shareBackup').onclick=async()=>{
    try{
      const file=new File([text],name,{type:'application/json'});
      if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){await navigator.share({title:'AuditionDesk backup',files:[file]});toast('Backup shared / saved');return}
      downloadText(name,text,'application/json');toast('Share unavailable — download requested');
    }catch(err){if(err?.name!=='AbortError'){downloadText(name,text,'application/json');toast('Share unavailable — download requested')}}
  };
}
function readFileAsText(file){
  return new Promise((resolve,reject)=>{
    if(!file){reject(new Error('No file was selected.'));return}
    const fr=new FileReader();
    fr.onload=()=>resolve(String(fr.result??''));
    fr.onerror=()=>reject(fr.error||new Error('Safari could not read the selected file. Please try selecting it again.'));
    fr.onabort=()=>reject(new Error('Reading the selected file was cancelled.'));
    try{fr.readAsText(file)}catch(err){reject(err)}
  });
}
function normalizeImportedState(x){
  if(!x || typeof x!=='object' || Array.isArray(x)) throw new Error('The selected file does not contain an AuditionDesk backup object.');
  if(!Array.isArray(x.roles)) throw new Error('The backup is missing its role list.');
  if(!Array.isArray(x.singers)) throw new Error('The backup is missing its singer list.');
  const cleanRoles=x.roles.map((r,i)=>({id:String(r?.id||`r${i+1}`),show:String(r?.show||''),name:String(r?.name||''),voice:String(r?.voice||'')}));
  if(!cleanRoles.length) throw new Error('The backup contains no roles.');
  const roleIds=new Set(cleanRoles.map(r=>r.id));
  const seen=new Set();
  const cleanSingers=x.singers.map((s,i)=>{
    const id=String(s?.id||uid('s')); if(seen.has(id)) throw new Error(`Duplicate singer ID found: ${id}`); seen.add(id);
    const rawScore=(s?.score===null||s?.score===''||typeof s?.score==='undefined')?null:Number(s.score);
    const score=Number.isFinite(rawScore)?Math.min(9,Math.max(3,rawScore)):null;
    const rs=Array.isArray(s?.roles)?s.roles.slice(0,3):[];
    const cleanedRoles=[0,1,2].map(j=>rs[j] && roleIds.has(String(rs[j])) ? String(rs[j]) : null);
    const status=s?.status==='no-show'?'no-show':(Number.isFinite(score)?'heard':'waiting');
    return {id,time:String(s?.time||''),name:String(s?.name||`Singer ${i+1}`),voice:String(s?.voice||''),score,roles:cleanedRoles,notes:String(s?.notes||''),followUp:!!s?.followUp,followUpReason:String(s?.followUpReason||''),status,order:Number.isFinite(Number(s?.order))?Number(s.order):i+1};
  });
  const votes=(x.votes && typeof x.votes==='object' && !Array.isArray(x.votes))?x.votes:{};
  const castList=Array.isArray(x.castList)?x.castList.map(c=>({name:String(c?.name||''),show:String(c?.show||''),role:String(c?.role||'')})).filter(c=>c.name.trim()):[];
  return {version:4,session:{name:String(x.session?.name||'Current Season Auditions'),day:String(x.session?.day||'Audition Day')},roles:cleanRoles,singers:cleanSingers,votes,castList};
}
function importStats(x){return {singers:x.singers.length,scored:x.singers.filter(s=>Number.isFinite(s.score)).length,unscored:x.singers.filter(s=>!Number.isFinite(s.score)).length,roles:x.roles.length,notes:x.singers.filter(s=>String(s.notes||'').trim()).length,cast:x.castList.length}}
function previewImportText(raw,label='JSON backup'){
  try{
    const parsed=JSON.parse(String(raw||''));
    const incoming=normalizeImportedState(parsed);
    showImportPreview(incoming,label);
  }catch(err){showImportError(err?.message||String(err))}
}
function showImportError(message){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="importErrorBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Could not read backup</h2><div class="error-note" style="margin:12px 0">${esc(message)}</div><p>Your current AuditionDesk data has <strong>not</strong> been changed.</p><div class="actions end"><button class="btn primary" id="importErrorClose">OK</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML=''; document.getElementById('importErrorClose').onclick=close; document.getElementById('importErrorBackdrop').addEventListener('click',e=>{if(e.target.id==='importErrorBackdrop')close()});
}
function showImportPreview(incoming,label){
  const a=importStats(incoming), current=importStats(normalizeImportedState(state));
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="importPreviewBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Ready to import</h2><p>${esc(label)} passed validation. Nothing has been replaced yet.</p><div class="summary-grid"><div class="summary-box"><span class="small muted">Incoming singers</span><strong>${a.singers}</strong><span class="small muted">${a.scored} scored · ${a.unscored} unscored</span></div><div class="summary-box"><span class="small muted">Incoming roles</span><strong>${a.roles}</strong><span class="small muted">${a.notes} singers with notes</span></div></div><div class="note"><strong>This will replace the current audition data.</strong><br>Your present ${current.singers} singers, scores, role choices, notes, votes, and imported cast-list data will be replaced by the contents of this backup.</div><div class="actions end" style="margin-top:18px"><button class="btn" id="importCancel">Cancel</button><button class="btn danger" id="importCommit">Replace current data</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('importCancel').onclick=close;
  document.getElementById('importPreviewBackdrop').addEventListener('click',e=>{if(e.target.id==='importPreviewBackdrop')close()});
  document.getElementById('importCommit').onclick=()=>{
    state=incoming; currentSingerId=state.singers[0]?.id||null; selectedRoleId=state.roles[0]?.id||null; queueQuery=''; followUpOnly=false; saveState(); page='live'; close(); render(); showImportSuccess(a);
  };
}
function showImportSuccess(stats){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="importSuccessBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Import complete</h2><div class="ok-note" style="margin:12px 0"><strong>${stats.singers} singers loaded successfully.</strong><br>${stats.scored} scored · ${stats.unscored} unscored · ${stats.roles} roles.</div><p>The previous test/demo audition data has been replaced. Spot-check a few singers and roles before entering new scores.</p><div class="actions end"><button class="btn primary" id="importSuccessClose">Go to Live Entry</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML=''; document.getElementById('importSuccessClose').onclick=close; document.getElementById('importSuccessBackdrop').addEventListener('click',e=>{if(e.target.id==='importSuccessBackdrop')close()});
}
async function importBackup(e){
  const input=e?.target; const file=input?.files?.[0]; if(!file)return;
  try{const raw=await readFileAsText(file); previewImportText(raw,file.name||'Selected backup')}
  catch(err){showImportError(err?.message||'The selected file could not be read.')}
}
async function handleBackupButton(){
  const input=document.getElementById('jsonInput');
  const file=input?.files?.[0];
  if(file){
    const status=document.getElementById('jsonFileStatus');
    if(status) status.textContent=`Reading ${file.name}…`;
    try{
      const raw=await readFileAsText(file);
      if(!raw.trim()) throw new Error('The selected backup file is empty.');
      previewImportText(raw,file.name||'Selected backup');
    }catch(err){
      if(status) status.textContent=`Could not read ${file.name}.`;
      showImportError(err?.message||'The selected file could not be read.');
    }
    return;
  }
  openPasteBackup();
}
function openPasteBackup(){
  document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="pasteBackupBackdrop"><div class="modal" role="dialog" aria-modal="true"><h2>Paste backup JSON</h2><p>This is a fallback for browsers that have trouble reading a selected file. Paste the complete contents of an AuditionDesk JSON backup below.</p><textarea class="json-preview" id="pastedBackup" placeholder="{\n  &quot;version&quot;: 3,\n  ...\n}"></textarea><div class="actions end" style="margin-top:14px"><button class="btn" id="pasteBackupCancel">Cancel</button><button class="btn primary" id="pasteBackupReview">Review import</button></div></div></div>`;
  const close=()=>document.getElementById('modalRoot').innerHTML='';
  document.getElementById('pasteBackupCancel').onclick=close; document.getElementById('pasteBackupBackdrop').addEventListener('click',e=>{if(e.target.id==='pasteBackupBackdrop')close()});
  document.getElementById('pasteBackupReview').onclick=()=>{const raw=document.getElementById('pastedBackup').value;if(!raw.trim()){toast('Paste the backup JSON first');return}close();previewImportText(raw,'Pasted backup JSON')};
  setTimeout(()=>document.getElementById('pastedBackup')?.focus(),0);
}
function exportEvaluationsCSV(){const head=['Order','Time','Name','Voice','Status','Score','Role 1','Role 2','Role 3','Notes'];const lines=[head,...state.singers.map(s=>[s.order||'',s.time||'',s.name||'',s.voice||'',s.status||'waiting',Number.isFinite(s.score)?s.score:'',...( [0,1,2].map(i=>{const r=getRole(s.roles?.[i]);return r?`${r.show} — ${r.name}`:''}) ),s.notes||''])].map(r=>r.map(csvCell).join(','));downloadText(`audition-evaluations-${dateStamp()}.csv`,lines.join('\r\n'),'text/csv;charset=utf-8');toast('Evaluations CSV exported')}
function csvCell(v){const s=String(v??'');return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function downloadText(name,text,type){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function dateStamp(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function toast(msg){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>{if(root.textContent===msg)root.innerHTML=''},2200)}

// Optional demo URL for quick screenshots/testing: AuditionDesk.html?demo=1
if(new URLSearchParams(location.search).get('demo')==='1' && !state.singers.length){state.singers=demoSingers();currentSingerId=state.singers[0].id;saveState()}
render();
})();
</script>
